<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plantillas — Professional Web</title>
    <meta name="description" content="Diseños listos para cafeterías, bares y restaurantes. Elige el estilo que va con tu negocio y lo adaptamos a tu marca.">
    <meta name="theme-color" content="#0a0a0a">

    <!-- Favicon: .ico para compatibilidad amplia, .png para pantallas de alta densidad -->
    <link rel="icon" href="Recursos/img/Logo/favicon.ico" sizes="32x32">
    <link rel="icon" href="Recursos/img/Logo/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="Recursos/img/Logo/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">

    <!-- La versión (?v=) fuerza a los navegadores a pedir la hoja de estilos
         de nuevo en vez de servir una copia antigua de su caché. Súbela cada
         vez que se añada o se renombre un archivo dentro de css/. -->
    <link rel="stylesheet" href="index.css?v=2">

    <!-- Guardián de la animación de entrada: marca el documento antes de pintar
         para que no haya parpadeo. Si el navegador no soporta IntersectionObserver
         o se pide reducir el movimiento, no se marca y todo se ve desde el inicio. -->
    <script>
        if ("IntersectionObserver" in window &&
            !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.classList.add("js-reveal");
        }
    </script>

    <!-- Componentes compartidos (cabecera y pie). Van SIN defer para que las
         etiquetas <pw-header> y <pw-footer> se pinten junto con la página. -->
    <script src="js/components/site-data.js"></script>
    <script src="js/components/atoms.js"></script>
    <script src="js/components/molecules.js"></script>
    <script src="js/components/organisms.js"></script>

    <script src="js/navbar.js" defer></script>
    <script src="js/reveal.js" defer></script>
    <script src="js/gallery.js" defer></script>
</head>

<body>

    <!-- Cabecera: skip-link + navbar + menú móvil (js/components/organisms.js) -->
    <pw-header current="plantillas.html"></pw-header>

    <main id="contenido">

        <section class="section section--below-nav" aria-labelledby="plantillas-titulo">
            <div class="container">

                <div class="page-header" data-reveal>
                    <p class="page-header__eyebrow">Plantillas</p>
                    <h1 class="page-header__title" id="plantillas-titulo">Diseños listos para tu negocio</h1>
                    <p class="page-header__lead">
                        Cada plantilla es un conjunto de pantallas reales, pensadas para cafeterías, bares y
                        restaurantes. Elige el estilo que va con tu negocio y lo adaptamos a tu marca.
                    </p>
                </div>

                <div class="gallery" data-reveal>
                    <div class="gallery__tabs">
                        <div class="gallery__tablist" role="tablist" aria-label="Tipo de diseño"
                            data-gallery-tabs>
                            <button class="gallery__tab" type="button" role="tab" id="tab-plantillas"
                                aria-controls="panel-plantillas" aria-selected="true">Plantillas</button>
                            <button class="gallery__tab" type="button" role="tab" id="tab-cartas"
                                aria-controls="panel-cartas" aria-selected="false">Otras cartas</button>
                        </div>
                    </div>

                    <!-- ----- Plantillas ---------------------------------- -->
                    <div class="gallery__panel" id="panel-plantillas" role="tabpanel" aria-labelledby="tab-plantillas">
                        <div class="gallery__list" role="tablist" aria-orientation="vertical"
                            aria-label="Plantillas por estilo" data-gallery-tabs>
                            <button class="gallery__item" type="button" role="tab" id="tab-p1"
                                aria-controls="rail-p1" aria-selected="true">
                                <span>Plantilla 1</span>
                                <span class="gallery__dot"></span>
                            </button>
                            <button class="gallery__item" type="button" role="tab" id="tab-p2"
                                aria-controls="rail-p2" aria-selected="false">
                                <span>Plantilla 2</span>
                                <span class="gallery__dot"></span>
                            </button>
                        </div>

                        <div class="gallery__stage">
                            <div class="gallery__screens scroller" id="rail-p1" role="tabpanel"
                                aria-labelledby="tab-p1">
                                <div class="gallery__track">
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla1/Inicio.jpg"
                                                alt="Pantalla de inicio de la plantilla 1" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla1/Tapas.jpg"
                                                alt="Sección de tapas de la plantilla 1" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla1/Hamburguesas.jpg"
                                                alt="Carta de hamburguesas de la plantilla 1" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla1/Cervezas.jpg"
                                                alt="Carta de cervezas de la plantilla 1" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla1/Alergenos.jpg"
                                                alt="Filtro de alérgenos de la plantilla 1" loading="lazy">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="gallery__screens scroller" id="rail-p2" role="tabpanel"
                                aria-labelledby="tab-p2">
                                <div class="gallery__track">
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla2/Inicio.jpg"
                                                alt="Pantalla de inicio de la plantilla 2" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla2/Tapas.jpg"
                                                alt="Sección de tapas de la plantilla 2" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla2/Hamburguesas.jpg"
                                                alt="Carta de hamburguesas de la plantilla 2" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla2/Cervezas.jpg"
                                                alt="Carta de cervezas de la plantilla 2" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/Plantilla2/Alergenos.jpg"
                                                alt="Filtro de alérgenos de la plantilla 2" loading="lazy">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ----- Otras cartas -------------------------------- -->
                    <div class="gallery__panel" id="panel-cartas" role="tabpanel" aria-labelledby="tab-cartas">
                        <div class="gallery__list" role="tablist" aria-orientation="vertical"
                            aria-label="Cartas ya publicadas" data-gallery-tabs>
                            <button class="gallery__item" type="button" role="tab" id="tab-c1"
                                aria-controls="rail-c1" aria-selected="true">
                                <span>Fusión Café</span>
                                <span class="gallery__dot"></span>
                            </button>
                            <button class="gallery__item" type="button" role="tab" id="tab-c2"
                                aria-controls="rail-c2" aria-selected="false">
                                <span>El Parke Lounge Bar</span>
                                <span class="gallery__dot"></span>
                            </button>
                        </div>

                        <div class="gallery__stage">
                            <div class="gallery__screens scroller" id="rail-c1" role="tabpanel"
                                aria-labelledby="tab-c1">
                                <div class="gallery__track">
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/FusionCafe/Inicio.JPG"
                                                alt="Pantalla de inicio de Fusión Café" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/FusionCafe/Dulces.JPG"
                                                alt="Sección de dulces de Fusión Café" loading="lazy">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="gallery__screens scroller" id="rail-c2" role="tabpanel"
                                aria-labelledby="tab-c2">
                                <div class="gallery__track">
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/ParkeLoungueBar/Inicio.JPG"
                                                alt="Pantalla de inicio de El Parke Lounge Bar" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/ParkeLoungueBar/Comidas.JPG"
                                                alt="Carta de comidas de El Parke Lounge Bar" loading="lazy">
                                        </div>
                                    </div>
                                    <div class="gallery__phone">
                                        <div class="gallery__screen">
                                            <img src="Recursos/img/ParkeLoungueBar/ComidasEN.JPG"
                                                alt="Carta de comidas en inglés de El Parke Lounge Bar" loading="lazy">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="button-row" data-reveal>
                    <a class="button button--primary" href="mailto:webcartaonline@gmail.com">Quiero una web así</a>
                    <a class="button button--ghost" href="precios.html">Ver precios</a>
                </div>

            </div>
        </section>

    </main>

    <!-- Pie (js/components/organisms.js) -->
    <pw-footer></pw-footer>

</body>

</html>
